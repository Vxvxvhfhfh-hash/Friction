<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎭 WhatsApp RP Bot - Interface Web</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎭</text></svg>">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .card {
            backdrop-filter: blur(20px);
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .gradient-text {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .chat-message {
            animation: slideIn 0.3s ease-out;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .rp-border {
            border: 2px solid #ffd700;
            border-radius: 15px;
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.1), rgba(255, 215, 0, 0.05));
        }
        
        .magic-glow {
            box-shadow: 0 0 20px rgba(102, 126, 234, 0.5);
        }
        
        .typing {
            opacity: 0.7;
            animation: pulse 1.5s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body class="min-h-screen">
    <!-- Header -->
    <header class="card m-4 p-6 rounded-xl">
        <div class="flex items-center justify-between">
            <div class="flex items-center space-x-4">
                <div class="text-4xl">🎭</div>
                <div>
                    <h1 class="text-2xl font-bold text-white">WhatsApp RP Bot</h1>
                    <p class="text-gray-300">Jeu de rôle immersif avec IA Gemini</p>
                </div>
            </div>
            <div class="flex items-center space-x-2">
                <div id="status-indicator" class="w-3 h-3 bg-red-500 rounded-full"></div>
                <span id="status-text" class="text-white text-sm">Déconnecté</span>
            </div>
        </div>
    </header>

    <div class="flex flex-col lg:flex-row gap-4 mx-4 mb-4">
        <!-- Panneau de contrôle -->
        <div class="lg:w-1/3">
            <!-- Sélection de personnage -->
            <div class="card p-6 rounded-xl mb-4">
                <h2 class="text-xl font-semibold text-white mb-4 flex items-center">
                    <i class="fas fa-user-circle mr-2"></i>
                    Personnages
                </h2>
                <div id="characters-list" class="space-y-3">
                    <!-- Personnages chargés dynamiquement -->
                </div>
            </div>

            <!-- Statut du personnage -->
            <div class="card p-6 rounded-xl mb-4">
                <h2 class="text-xl font-semibold text-white mb-4 flex items-center">
                    <i class="fas fa-chart-bar mr-2"></i>
                    Statut
                </h2>
                <div id="character-status" class="text-gray-300">
                    <p class="text-center">Aucun personnage sélectionné</p>
                </div>
            </div>

            <!-- Actions rapides -->
            <div class="card p-6 rounded-xl">
                <h2 class="text-xl font-semibold text-white mb-4 flex items-center">
                    <i class="fas fa-bolt mr-2"></i>
                    Actions Rapides
                </h2>
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="quickAction('explorer')" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-2 rounded text-sm transition">
                        🔍 Explorer
                    </button>
                    <button onclick="quickAction('combattre')" class="bg-red-600 hover:bg-red-700 text-white px-3 py-2 rounded text-sm transition">
                        ⚔️ Combat
                    </button>
                    <button onclick="quickAction('magie')" class="bg-purple-600 hover:bg-purple-700 text-white px-3 py-2 rounded text-sm transition">
                        🪄 Magie
                    </button>
                    <button onclick="quickAction('inventaire')" class="bg-green-600 hover:bg-green-700 text-white px-3 py-2 rounded text-sm transition">
                        🎒 Inventaire
                    </button>
                </div>
            </div>
        </div>

        <!-- Zone de chat RP -->
        <div class="lg:w-2/3">
            <div class="card p-6 rounded-xl h-[600px] flex flex-col">
                <h2 class="text-xl font-semibold text-white mb-4 flex items-center">
                    <i class="fas fa-comments mr-2"></i>
                    Chat RP Immersif
                </h2>
                
                <!-- Messages -->
                <div id="chat-messages" class="flex-1 overflow-y-auto space-y-4 mb-4 pr-2">
                    <!-- Messages chargés dynamiquement -->
                </div>
                
                <!-- Zone de saisie -->
                <div class="flex space-x-3">
                    <input 
                        type="text" 
                        id="message-input" 
                        placeholder="Décrivez votre action..." 
                        class="flex-1 bg-white bg-opacity-20 text-white placeholder-gray-300 px-4 py-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400"
                        onkeypress="handleKeyPress(event)"
                    >
                    <button 
                        onclick="sendMessage()" 
                        id="send-button"
                        class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-lg transition magic-glow"
                    >
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal de média -->
    <div id="media-modal" class="fixed inset-0 bg-black bg-opacity-75 hidden z-50 flex items-center justify-center">
        <div class="max-w-4xl max-h-full p-4">
            <div class="relative">
                <button onclick="closeMediaModal()" class="absolute top-2 right-2 text-white text-2xl z-10">
                    <i class="fas fa-times"></i>
                </button>
                <div id="media-content"></div>
            </div>
        </div>
    </div>

    <script>
        // État global de l'application
        let currentSession = null;
        let selectedCharacter = null;
        let isLoading = false;

        // Initialisation
        document.addEventListener('DOMContentLoaded', function() {
            loadCharacters();
            addWelcomeMessage();
            checkServerStatus();
            setInterval(checkServerStatus, 30000); // Vérifier toutes les 30 secondes
        });

        // Vérifier le statut du serveur
        async function checkServerStatus() {
            try {
                const response = await fetch('/api/health');
                const data = await response.json();
                
                if (response.ok) {
                    updateStatus('connected', 'Connecté');
                } else {
                    updateStatus('disconnected', 'Erreur serveur');
                }
            } catch (error) {
                updateStatus('disconnected', 'Déconnecté');
            }
        }

        // Mettre à jour le statut
        function updateStatus(status, text) {
            const indicator = document.getElementById('status-indicator');
            const statusText = document.getElementById('status-text');
            
            if (status === 'connected') {
                indicator.className = 'w-3 h-3 bg-green-500 rounded-full';
            } else {
                indicator.className = 'w-3 h-3 bg-red-500 rounded-full';
            }
            
            statusText.textContent = text;
        }

        // Charger la liste des personnages
        async function loadCharacters() {
            try {
                const response = await fetch('/api/characters');
                const characters = await response.json();
                
                const container = document.getElementById('characters-list');
                container.innerHTML = '';
                
                Object.entries(characters).forEach(([key, character]) => {
                    const div = document.createElement('div');
                    div.className = 'rp-border p-4 cursor-pointer hover:bg-opacity-20 hover:bg-white transition';
                    div.onclick = () => selectCharacter(key, character);
                    
                    div.innerHTML = `
                        <div class="flex items-center space-x-3">
                            <div class="text-2xl">${getCharacterEmoji(character.class)}</div>
                            <div>
                                <h3 class="text-white font-semibold">${character.name}</h3>
                                <p class="text-gray-300 text-sm">${character.class} - Niveau ${character.level}</p>
                            </div>
                        </div>
                    `;
                    
                    container.appendChild(div);
                });
            } catch (error) {
                console.error('Erreur chargement personnages:', error);
            }
        }

        // Obtenir l'emoji du personnage
        function getCharacterEmoji(characterClass) {
            const emojis = {
                'Guerrier': '⚔️',
                'Mage': '🧙‍♂️',
                'Voleur': '🗡️'
            };
            return emojis[characterClass] || '👤';
        }

        // Sélectionner un personnage
        async function selectCharacter(key, character) {
            try {
                const response = await fetch('/api/select-character', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ characterKey: key })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    selectedCharacter = character;
                    updateCharacterStatus(character);
                    addSystemMessage(`✨ Vous incarnez maintenant ${character.name} !`);
                    
                    // Générer une description d'ambiance
                    generateLocationDescription(character.location);
                }
            } catch (error) {
                console.error('Erreur sélection personnage:', error);
            }
        }

        // Mettre à jour l'affichage du statut
        function updateCharacterStatus(character) {
            const container = document.getElementById('character-status');
            container.innerHTML = `
                <div class="space-y-3">
                    <div class="flex items-center space-x-2">
                        <span class="text-2xl">${getCharacterEmoji(character.class)}</span>
                        <div>
                            <h3 class="text-white font-semibold">${character.name}</h3>
                            <p class="text-gray-300 text-sm">${character.class}</p>
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-2 text-sm">
                        <div class="bg-red-600 bg-opacity-30 p-2 rounded">
                            <div class="text-red-300">PV</div>
                            <div class="text-white font-bold">${character.hp}</div>
                        </div>
                        <div class="bg-blue-600 bg-opacity-30 p-2 rounded">
                            <div class="text-blue-300">PM</div>
                            <div class="text-white font-bold">${character.mp}</div>
                        </div>
                        <div class="bg-orange-600 bg-opacity-30 p-2 rounded">
                            <div class="text-orange-300">Force</div>
                            <div class="text-white font-bold">${character.stats.force}</div>
                        </div>
                        <div class="bg-green-600 bg-opacity-30 p-2 rounded">
                            <div class="text-green-300">Agilité</div>
                            <div class="text-white font-bold">${character.stats.agilité}</div>
                        </div>
                    </div>
                    
                    <div class="bg-purple-600 bg-opacity-20 p-3 rounded">
                        <div class="text-purple-300 text-sm mb-1">Lieu actuel</div>
                        <div class="text-white">${character.location}</div>
                    </div>
                </div>
            `;
        }

        // Générer une description de lieu
        async function generateLocationDescription(location) {
            try {
                const response = await fetch('/api/location-description', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ location })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    addBotMessage(result.description, 'location');
                }
            } catch (error) {
                console.error('Erreur description lieu:', error);
            }
        }

        // Envoyer un message
        async function sendMessage() {
            const input = document.getElementById('message-input');
            const message = input.value.trim();
            
            if (!message || isLoading) return;
            
            if (!selectedCharacter) {
                addSystemMessage('⚠️ Veuillez d\'abord sélectionner un personnage !');
                return;
            }
            
            // Afficher le message utilisateur
            addUserMessage(message);
            input.value = '';
            setLoading(true);
            
            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ 
                        message,
                        character: selectedCharacter 
                    })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    addBotMessage(result.response, result.context?.type);
                    
                    // Afficher les médias si disponibles
                    if (result.media) {
                        showMedia(result.media);
                    }
                } else {
                    addSystemMessage('❌ Erreur lors du traitement du message');
                }
            } catch (error) {
                console.error('Erreur envoi message:', error);
                addSystemMessage('❌ Erreur de connexion');
            } finally {
                setLoading(false);
            }
        }

        // Actions rapides
        async function quickAction(action) {
            const actions = {
                'explorer': 'Je regarde autour de moi et j\'explore les environs',
                'combattre': 'Je me prépare au combat et attaque',
                'magie': 'Je lance un sort magique',
                'inventaire': 'Je consulte mon inventaire'
            };
            
            if (actions[action]) {
                document.getElementById('message-input').value = actions[action];
                await sendMessage();
            }
        }

        // Gestion de la touche Entrée
        function handleKeyPress(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        // Ajouter un message utilisateur
        function addUserMessage(message) {
            const container = document.getElementById('chat-messages');
            const div = document.createElement('div');
            div.className = 'chat-message flex justify-end';
            
            div.innerHTML = `
                <div class="bg-blue-600 text-white p-4 rounded-lg max-w-xs lg:max-w-md">
                    <div class="flex items-center space-x-2 mb-2">
                        <span class="text-sm opacity-75">👤 Vous</span>
                    </div>
                    <p>${message}</p>
                </div>
            `;
            
            container.appendChild(div);
            scrollToBottom();
        }

        // Ajouter un message du bot
        function addBotMessage(message, type = 'story') {
            const container = document.getElementById('chat-messages');
            const div = document.createElement('div');
            div.className = 'chat-message flex justify-start';
            
            const emoji = getContextEmoji(type);
            
            div.innerHTML = `
                <div class="rp-border bg-gradient-to-r from-purple-600 to-blue-600 text-white p-4 rounded-lg max-w-xs lg:max-w-md">
                    <div class="flex items-center space-x-2 mb-2">
                        <span class="text-sm opacity-75">${emoji} Maître de Jeu</span>
                    </div>
                    <div class="whitespace-pre-wrap">${message}</div>
                </div>
            `;
            
            container.appendChild(div);
            scrollToBottom();
        }

        // Ajouter un message système
        function addSystemMessage(message) {
            const container = document.getElementById('chat-messages');
            const div = document.createElement('div');
            div.className = 'chat-message flex justify-center';
            
            div.innerHTML = `
                <div class="bg-gray-600 bg-opacity-50 text-gray-300 px-4 py-2 rounded-lg text-sm">
                    ${message}
                </div>
            `;
            
            container.appendChild(div);
            scrollToBottom();
        }

        // Message de bienvenue
        function addWelcomeMessage() {
            addSystemMessage('🎭 Bienvenue dans l\'univers du jeu de rôle ! Sélectionnez un personnage pour commencer votre aventure.');
        }

        // Obtenir l'emoji contextuel
        function getContextEmoji(type) {
            const emojis = {
                'combat': '⚔️',
                'magic': '✨',
                'exploration': '🔍',
                'dialogue': '💬',
                'location': '🏰',
                'story': '📖'
            };
            return emojis[type] || '📖';
        }

        // Afficher les médias
        function showMedia(media) {
            if (media.image) {
                const container = document.getElementById('chat-messages');
                const div = document.createElement('div');
                div.className = 'chat-message flex justify-center';
                
                div.innerHTML = `
                    <div class="cursor-pointer" onclick="openMediaModal('${media.image}', 'image')">
                        <img src="${media.image}" alt="Média contextuel" class="rounded-lg max-w-xs hover:scale-105 transition">
                        <p class="text-center text-gray-300 text-sm mt-2">${media.description || 'Cliquez pour agrandir'}</p>
                    </div>
                `;
                
                container.appendChild(div);
                scrollToBottom();
            }
        }

        // Ouvrir le modal de média
        function openMediaModal(src, type) {
            const modal = document.getElementById('media-modal');
            const content = document.getElementById('media-content');
            
            if (type === 'image') {
                content.innerHTML = `<img src="${src}" class="max-w-full max-h-full rounded-lg">`;
            }
            
            modal.classList.remove('hidden');
        }

        // Fermer le modal de média
        function closeMediaModal() {
            document.getElementById('media-modal').classList.add('hidden');
        }

        // Gérer l'état de chargement
        function setLoading(loading) {
            isLoading = loading;
            const button = document.getElementById('send-button');
            const input = document.getElementById('message-input');
            
            if (loading) {
                button.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
                button.disabled = true;
                input.disabled = true;
                addTypingIndicator();
            } else {
                button.innerHTML = '<i class="fas fa-paper-plane"></i>';
                button.disabled = false;
                input.disabled = false;
                removeTypingIndicator();
            }
        }

        // Indicateur de frappe
        function addTypingIndicator() {
            const container = document.getElementById('chat-messages');
            const div = document.createElement('div');
            div.id = 'typing-indicator';
            div.className = 'chat-message flex justify-start typing';
            
            div.innerHTML = `
                <div class="bg-gray-600 bg-opacity-50 text-gray-300 p-4 rounded-lg">
                    <div class="flex items-center space-x-2">
                        <span class="text-sm">🎭 Le Maître de Jeu réfléchit...</span>
                        <div class="flex space-x-1">
                            <div class="w-2 h-2 bg-gray-400 rounded-full animate-bounce"></div>
                            <div class="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style="animation-delay: 0.1s"></div>
                            <div class="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style="animation-delay: 0.2s"></div>
                        </div>
                    </div>
                </div>
            `;
            
            container.appendChild(div);
            scrollToBottom();
        }

        // Supprimer l'indicateur de frappe
        function removeTypingIndicator() {
            const indicator = document.getElementById('typing-indicator');
            if (indicator) {
                indicator.remove();
            }
        }

        // Faire défiler vers le bas
        function scrollToBottom() {
            const container = document.getElementById('chat-messages');
            container.scrollTop = container.scrollHeight;
        }
    </script>
</body>
</html>
